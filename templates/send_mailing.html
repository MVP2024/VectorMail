<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отправить рассылку</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .messages { list-style: none; padding: 0; }
        .messages li { padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        {#.messages .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }#}
        {#.messages .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }#}
        {#.messages .warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }#}
        {#.messages .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }#}
        form { margin-top: 20px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; max-width: 500px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h1>Отправить рассылку вручную</h1>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Отправить рассылку</button>
    </form>

    <p><a href="/admin/">Перейти в админ-панель</a></p>
</body>
</html>
