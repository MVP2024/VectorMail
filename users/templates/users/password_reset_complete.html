{% extends 'base.html' %}

{% block title %}Пароль изменен{% endblock %}

{% block content %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card mt-5">
                    <div class="card-header text-center">
                        <h3>Пароль успешно изменен</h3>
                    </div>
                    <div class="card-body text-center">
                        <p>Ваш пароль был успешно изменен. Теперь вы можете войти в систему с новым паролем.</p>
                        <a href="{% url 'users:login' %}" class="btn btn-primary mt-3">Войти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
